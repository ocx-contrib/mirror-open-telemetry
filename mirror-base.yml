# Shared base for every spec in this repository (the OpenTelemetry Collector
# releases repo, `open-telemetry/opentelemetry-collector-releases`).
#
# NOT a spec: it has no name/target/source and is never loaded on its own.
# Everything a package owns — name, target, source, assets, asset_type,
# bin_scan, metadata, catalog, tests, versions, announce, annotations — stays
# in that package's own mirror.yml.
#
# ⚠️ `extends:` is a SHALLOW merge of top-level keys. A spec that sets a key
# below replaces that block OUTRIGHT — there is no per-key merge. `platforms:`
# is where this bites: it carries BOTH the runner matrix and the container
# legs, so a child that restates it to tweak one runner silently drops every
# `containers:` entry. Nothing reds — the legs simply stop existing, and every
# os.features claim in that spec goes back to being merely asserted. Restate
# `platforms:` IN FULL or not at all. otelcol/mirror.yml deliberately does NOT
# restate it, which removes that trap structurally.

skip_prereleases: true
cascade: true

# New package; upstream versions are bare semver (`0.165.0`) carrying no
# `+build` segment, so the fleet default applies with no exception. A cascade
# tag (`latest`, `0`, `0.165`) re-points on every re-publish; without a build
# segment the new manifest would reuse the bare version tag and orphan the
# prior digest for registry GC, breaking any `@sha256:` pin in a consumer's
# ocx.lock.
build_timestamp: date

# No `verify:` block. The source is a `url_index` generator, and the SDK's
# `IndexBuilder` emits plain `name -> url` strings (no `{url, sha256}` object
# form; its `Asset` model drops GitHub's per-asset `digest`), so no digest is
# declared and `github_asset_digest` / `url_index_digest` (both default
# `if_present`) have nothing to check. `checksums_file` takes ONE release-level
# sha256sum URL; upstream publishes only per-asset `<asset>.sha256` sidecars, so
# it cannot be used either. Downloads are therefore HTTPS-only, unverified.

concurrency:
  # The binary is large: the unpacked `otelcol` is ~165-184 MB per platform
  # (measured on 0.165.0: linux/amd64 180580512 B, linux/arm64 164561056 B,
  # darwin/arm64 170899858 B, windows/amd64 184466944 B), so the fleet-typical
  # fan-out is dialled down.
  max_downloads: 4
  max_bundles: 2
  max_pushes: 2
  rate_limit_ms: 100
  max_retries: 3
  compression_threads: 0

# ─── Platform matrix ────────────────────────────────────────────────────────
#
# `os.features` states what an artifact REQUIRES OF THE HOST — it is not a
# label for how it was built. Upstream's Linux binaries are Go builds with cgo
# disabled and were byte-measured on BOTH declared arches (0.165.0):
# `statically linked`, zero PT_INTERP, zero DT_NEEDED. The measurement
# transcript is recorded above otelcol/mirror.yml's `assets:`.
#
# So both Linux keys are BARE. `+libc.glibc` or `+libc.musl` would be a false
# requirement that hid the package from hosts it in fact runs on.
#
# A bare key claims universality, so it must prove it: ubuntu (glibc) + alpine
# (musl) + fedora (a different glibc vintage). The ALPINE LEG IS THE PROOF —
# drop it and the universal claim is merely asserted.
#
# No `containers[].setup:`: the smoke runs `otelcol --version` and
# `otelcol validate` on a config written into scratch — no network, no ports,
# no host tools.
platforms:
  linux/amd64:
    runner: ubuntu-latest
    containers:
      - { image: "ubuntu:24.04", shell: bash }
      - { image: "alpine:3.20",  shell: sh }
      - { image: "fedora:40",    shell: bash }
  linux/arm64:
    # arm64 container legs run natively — no qemu — so the runner arch must
    # match the platform or the renderer reds the leg up front.
    runner: ubuntu-24.04-arm
    containers:
      - { image: "ubuntu:24.04", shell: bash }
      - { image: "alpine:3.20",  shell: sh }
      - { image: "fedora:40",    shell: bash }
  # ── Pass 2 (darwin) ────────────────────────────────────────────────────────
  # Kept commented in lockstep with the matching `assets:` keys in
  # otelcol/mirror.yml. A declared platform with no resolvable asset does not
  # red — it boots a real runner and reports SUCCESS having tested nothing —
  # so the platform key and its asset regex are uncommented in the SAME pass.
  # darwin/amd64:
  #   # Intel slice tested on the arm64 macos-15 runner via Rosetta 2 —
  #   # GitHub's native macos-13 Intel pool is exhausted and deadlocks push.
  #   runner: macos-15
  #   prefix: ["arch", "-x86_64"]
  # darwin/arm64:
  #   runner: macos-15
  #   shell: bash
  # ── Pass 3 (windows) ───────────────────────────────────────────────────────
  # windows/amd64:
  #   runner: windows-latest
  #   shell: pwsh
  # windows/arm64:
  #   runner: windows-11-arm
  #   shell: pwsh
  #
  # No `containers:` on darwin or windows — those runners have no Linux
  # container engine, and the key is rejected at spec load.

notify:
  discord:
    webhook_secret: OCX_MIRROR_DISCORD_HOOK
    user_id: "227748867204972545"  # pinged in-message on failures
