# ⚠ `extends:` is a SHALLOW merge of TOP-LEVEL KEYS. Setting a key here
# REPLACES the base's block outright — there is no per-key merge. `platforms:`
# is deliberately NOT restated below: it carries the container legs that make
# this spec's bare Linux keys honest, and restating it to tweak one runner
# would drop them all without reddening anything.
extends: ../mirror-base.yml

name: otelcol

# Logical index package `open-telemetry/otelcol` at the physical path
# `ghcr.io/ocx-contrib/open-telemetry/otelcol` — slash segments, never
# hyphen-flattened. Two segments always; the GitHub org IS the project's own
# brand, so the org names the namespace. The package segment is the name the
# distribution publishes under (`otelcol`, the CORE distribution — not
# `otelcol-contrib`). The first segment must be this repo's own GitHub owner:
# GITHUB_TOKEN only authorises packages owned by the repo the workflow runs in.
target:
  registry: ghcr.io
  repository: ocx-contrib/open-telemetry/otelcol

source:
  type: github_release
  owner: open-telemetry
  repo: opentelemetry-collector-releases
  # ⚠ THE ANCHORS MATTER. This one repository tags several independently
  # versioned components on the same numbers:
  #   v0.165.0                     — the collector distributions  (wanted)
  #   cmd/builder/v0.165.0         — the OCB builder              (NOT this package)
  #   cmd/opampsupervisor/v0.165.0 — the OpAMP supervisor         (NOT this package)
  # (`gh api repos/open-telemetry/opentelemetry-collector-releases/releases
  # --jq '.[].tag_name'` lists all three per release.) `^v…$` matches only the
  # first: the leading `^v` rejects the `cmd/…/v…` tags, the trailing `$`
  # rejects any suffixed tag.
  tag_pattern: "^v(?P<version>\\d+\\.\\d+\\.\\d+)$"

# ─── libc gate (Phase 3.5) — the evidence, not the conclusion ───────────────
#
# otelcol is Go, but "Go" is not the verdict — a cgo-enabled Go build links
# libc dynamically. Measured on BOTH declared Linux arches (v0.165.0, the only
# in-range release):
#
#   $ file otelcol_0.165.0_linux_amd64/otelcol
#   ELF 64-bit LSB executable, x86-64, version 1 (SYSV), statically linked, Go BuildID=…, stripped
#   $ readelf -l … | grep -c INTERP  → 0
#   $ readelf -d … | grep NEEDED     → (none)
#
#   $ file otelcol_0.165.0_linux_arm64/otelcol
#   ELF 64-bit LSB executable, ARM aarch64, version 1 (SYSV), statically linked, Go BuildID=…, stripped
#   $ readelf -l … | grep -c INTERP  → 0
#   $ readelf -d … | grep NEEDED     → (none)
#
# No PT_INTERP and no DT_NEEDED on either: the artifact requires nothing of the
# host, so both Linux keys are BARE — no `+libc.*` suffix. Container legs
# (ubuntu + alpine + fedora on both arches) live in ../mirror-base.yml and are
# what turn that claim into evidence.
#
# ─── Scope + resolution (verified on v0.165.0, the only in-range release) ───
#
# `versions.min` is the newest release, so the mirrored range is exactly
# v0.165.0. Its 816 assets were listed with
#   gh api --paginate repos/open-telemetry/opentelemetry-collector-releases/releases/tags/v0.165.0 --jq '.assets[].name'
# and each pattern below matched EXACTLY ONE of them (both-ways check):
#   ^otelcol_.*_linux_amd64\.tar\.gz$   → otelcol_0.165.0_linux_amd64.tar.gz
#   ^otelcol_.*_linux_arm64\.tar\.gz$   → otelcol_0.165.0_linux_arm64.tar.gz
#   ^otelcol_.*_darwin_amd64\.tar\.gz$  → otelcol_0.165.0_darwin_amd64.tar.gz
#   ^otelcol_.*_darwin_arm64\.tar\.gz$  → otelcol_0.165.0_darwin_arm64.tar.gz
#   ^otelcol_.*_windows_amd64\.tar\.gz$ → otelcol_0.165.0_windows_amd64.tar.gz
#   ^otelcol_.*_windows_arm64\.tar\.gz$ → otelcol_0.165.0_windows_arm64.tar.gz
# A pattern matching zero would be silently skipped rather than reported, so
# this check is not optional. Older releases were NOT sampled — they are below
# the floor — so a future `versions.min` change must redo the check.
#
# ⚠ EVERY PATTERN IS ANCHORED `^otelcol_…\.tar\.gz$`. The same release also
# carries `otelcol-contrib_`, `otelcol-k8s_`, `otelcol-otlp_`,
# `otelcol-prometheus_` and `otelcol-ebpf-profiler_` distributions (a
# DIFFERENT, much larger component set — not this package), plus `.deb`, `.rpm`
# and `.msi` installers and `.sha256` / `.sbom.json` / `.sigstore.json`
# sidecars. The underscore directly after `otelcol` is what keeps the other
# distributions out (`otelcol-contrib_…` has a hyphen there), and the `$`
# anchor keeps the sidecars (`….tar.gz.sbom.json`) out. Windows assets are
# `.tar.gz` too, not zip.
#
# Upstream also publishes, and this mirror deliberately does not carry:
#   otelcol_<V>_linux_386.tar.gz       — ocx has no linux/386 Architecture
#   otelcol_<V>_linux_armv7.tar.gz     — ocx has no 32-bit arm Architecture
#   otelcol_<V>_linux_ppc64le.tar.gz   — ocx has no ppc64le Architecture
#   otelcol_<V>_linux_riscv64.tar.gz   — ocx has no riscv64 Architecture
#   otelcol_<V>_linux_s390x.tar.gz     — ocx has no s390x Architecture
#   otelcol_<V>_windows_386.tar.gz     — ocx has no windows/386 Architecture
#   otelcol_<V>_aix_ppc64.tar.gz       — ocx has no aix OperatingSystem
#   (plus the .deb / .rpm / .msi installers and sidecars named above)
assets:
  linux/amd64:
    - "^otelcol_.*_linux_amd64\\.tar\\.gz$"
  linux/arm64:
    - "^otelcol_.*_linux_arm64\\.tar\\.gz$"
  # ── Pass 2 (darwin) ────────────────────────────────────────────────────────
  # darwin/amd64:
  #   - "^otelcol_.*_darwin_amd64\\.tar\\.gz$"
  # darwin/arm64:
  #   - "^otelcol_.*_darwin_arm64\\.tar\\.gz$"
  # ── Pass 3 (windows) ───────────────────────────────────────────────────────
  # windows/amd64:
  #   - "^otelcol_.*_windows_amd64\\.tar\\.gz$"
  # windows/arm64:
  #   - "^otelcol_.*_windows_arm64\\.tar\\.gz$"

# Every archive is FLAT: `otelcol` (`otelcol.exe` on Windows) sits at the
# archive root beside README.md, with no wrapper directory and no leading `./`.
# Verified by `tar tzvf` on 0.165.0 linux/amd64, linux/arm64, darwin/arm64 and
# windows/amd64 — two entries each, no directory members:
#   -rw-r--r-- README.md
#   -rwxr-xr-x otelcol            (otelcol.exe on windows, also -rwxr-xr-x)
# So strip_components 0 on every platform, the binary lands at the content root,
# and one metadata.json (PATH = ${installPath}) serves every platform. The
# archive carries NO LICENSE file (see NOTICE.md).
asset_type:
  type: archive
  strip_components: 0

# FORCED by the flat archive, not chosen. `bin_scan` only inspects an
# interface-visible `${installPath}/<dir>` PATH entry, and this archive has no
# subdirectory to point one at, so both `auto` and `verify` fail spec load at
# exit 65 ("bin_scan is enabled but metadata.json declares no
# interface-visible ${installPath}/<dir> PATH entry").
#
# The `binaries` list in metadata.json is therefore hand-maintained: `otelcol`
# (`otelcol.exe` on Windows) is the only mode-0755 entry in the archive;
# README.md is 0644 data. Quoted so no YAML 1.1 reader folds the bare word
# into boolean `false`.
bin_scan: "off"

metadata:
  default: metadata.json

catalog:
  logo: logo.svg

versions:
  # 0.165.0 is the newest release at authoring time (2026-11-19), chosen as the
  # floor on the owner's instruction. Upstream cuts a release roughly every two
  # weeks, so the range grows by itself.
  min: "0.165.0"
  new_per_run: 5
  poll_interval: "7 1-23/6 * * *"

tests:
  # `script:` resolves from the REPOSITORY ROOT — unlike `metadata.default` and
  # `catalog.logo` above, which resolve against this spec's own directory.
  #
  # The smoke validates configs with `otelcol validate`; it never starts the
  # collector, so it binds no ports and needs no network.
  - name: smoke
    script: otelcol/tests/smoke.star

annotations:
  # From the Phase 1.5 license gate:
  #   $ gh api repos/open-telemetry/opentelemetry-collector-releases/license --jq '.license.spdx_id'
  #   Apache-2.0
  org.opencontainers.image.licenses: "Apache-2.0"

announce:
  # Spelled out, not derived from target.repository — the logical name and the
  # physical path are related by convention only.
  package: open-telemetry/otelcol
  fork: ocx-contrib/index
